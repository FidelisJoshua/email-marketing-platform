{% extends "base.html" %}

{% block title %}
Edit Contact - EmailFlow
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <div class="page-eyebrow">
            CONTACT
        </div>

        <h1 class="page-title">
            Edit Contact
        </h1>

        <p class="page-subtitle">
            Update this contact's information.
        </p>

    </div>

    <a
        href="{{ url_for('contacts') }}"
        class="btn-secondary-custom">

        ← Back to Contacts

    </a>

</div>


<div class="form-card">

    <form method="POST">

        <div class="mb-4">

            <label class="form-label-custom">
                Name
            </label>

            <input
                type="text"
                name="name"
                class="form-control-custom"
                value="{{ contact.name }}"
                required>

        </div>


        <div class="mb-4">

            <label class="form-label-custom">
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control-custom"
                value="{{ contact.email }}"
                required>

        </div>


        <button
            type="submit"
            class="btn-primary-custom">

            Save Changes

        </button>

    </form>

</div>

{% endblock %}
