<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password - EmailFlow
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;
        }

        .card {

            width: 100%;
            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);
        }

        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #4f46e5;

            margin-bottom: 30px;
        }

        h1 {

            margin: 0 0 12px;

            color: #111827;

            text-align: center;
        }

        .description {

            color: #6b7280;

            line-height: 1.6;

            text-align: center;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #374151;
        }

        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 16px;

            margin-bottom: 20px;
        }

        input:focus {

            outline: none;

            border-color: #4f46e5;
        }

        button {

            width: 100%;

            border: none;

            border-radius: 8px;

            padding: 14px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #4338ca;
        }

        .back {

            text-align: center;

            margin-top: 25px;
        }

        .back a {

            color: #4f46e5;

            text-decoration: none;

            font-weight: 600;
        }

        .flash {

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 8px;

            background: #ecfdf5;

            color: #065f46;

            font-size: 14px;
        }

    </style>

</head>


<body>

<div class="card">

    <div class="logo">
        EmailFlow
    </div>


    <h1>
        Forgot your password?
    </h1>


    <p class="description">

        Enter your email address and we'll
        send you a link to reset your password.

    </p>


    {% with messages = get_flashed_messages(
        with_categories=true
    ) %}

        {% for category, message in messages %}

            <div class="flash">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
        >

        <button type="submit">
            Send Reset Link
        </button>

    </form>


    <div class="back">

        <a href="{{ url_for('login') }}">
            ← Back to Login
        </a>

    </div>

</div>

</body>

</html>
