<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        EmailFlow
        {% endblock %}
    </title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="public-page">


    <!-- ================= NAVBAR ================= -->

    <nav class="public-navbar">

        <div class="public-container">


            <a
                href="{{ url_for('home') }}"
                class="public-brand"
            >

                <div class="brand-icon">
                    ✉
                </div>

                <div>

                    <div class="brand-name">
                        EmailFlow
                    </div>

                    <div class="brand-subtitle">
                        Marketing Platform
                    </div>

                </div>

            </a>


            <div class="public-nav-links">

                <a href="{{ url_for('home') }}">
                    Home
                </a>

                <a href="#features">
                    Features
                </a>

                <a href="#about">
                    About
                </a>

                <a
                    href="{{ url_for('login') }}"
                    class="nav-login"
                >
                    Login
                </a>

                <a
                    href="{{ url_for('register') }}"
                    class="nav-signup"
                >
                    Get Started
                </a>

            </div>

        </div>

    </nav>


    <!-- ================= FLASH MESSAGES ================= -->

    <div class="public-container">

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }}">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

    </div>


    <!-- ================= PAGE CONTENT ================= -->

    {% block content %}

    {% endblock %}


</body>

</html>
