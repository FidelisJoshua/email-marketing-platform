{% extends "base.html" %}

{% block title %}
Login | EmailFlow
{% endblock %}


{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            ✉
        </div>

        <h1>
            Welcome back
        </h1>

        <p class="auth-subtitle">
            Sign in to your EmailFlow account.
        </p>


        <form method="POST">


            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button full-width"
            >
                Login
            </button>


        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create one
            </a>

        </p>

    </div>

</div>

{% endblock %}
