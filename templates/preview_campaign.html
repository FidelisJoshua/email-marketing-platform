{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h1>Campaign Preview</h1>

    <div class="card mt-4">

        <div class="card-header">
            <strong>Subject</strong>
        </div>

        <div class="card-body">

            <h3>{{ campaign.subject }}</h3>

            <hr>

            <p style="white-space: pre-wrap;">
                {{ campaign.message }}
            </p>

        </div>

    </div>

    <div class="mt-4">

        <a
            href="{{ url_for('send_test_email', campaign_id=campaign.id) }}"
            class="btn btn-warning">

            Send Test Email

        </a>

        <a
            href="{{ url_for('send_campaign', campaign_id=campaign.id) }}"
            class="btn btn-success">

            Send Campaign

        </a>

        <a
            href="{{ url_for('campaigns') }}"
            class="btn btn-secondary">

            ← Back to Campaigns

        </a>

    </div>

</div>

{% endblock %}
