{% extends "base.html" %}

{% block content %}

<div class="row">

    <div class="col-md-12">

        <div class="card shadow">

            <div class="card-body">

                <h2>
                    Welcome, {{ name }} 👋
                </h2>

                <p class="text-muted">
                    This is your Email Marketing Dashboard.
                </p>

            </div>

        </div>

    </div>

</div>

<br>

<div class="row">

    <div class="col-md-4">

        <div class="card text-center shadow">

            <div class="card-body">

                <h3>👥 Contacts</h3>

                <h1>{{ total_contacts }}</h1>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card text-center shadow">

            <div class="card-body">

                <h3>📧 Campaigns</h3>

                <h1>0</h1>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card text-center shadow">

            <div class="card-body">

                <h3>📨 Emails Sent</h3>

                <h1>0</h1>

            </div>

        </div>

    </div>

</div>

<br>

<a
    href="{{ url_for('contacts') }}"
    class="btn btn-primary">

    Manage Contacts

</a>

<a
    href="{{ url_for('campaigns') }}"
    class="btn btn-success">

    Campaigns

</a>

{% endblock %}
