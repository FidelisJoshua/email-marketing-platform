<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Password - EmailFlow
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;
        }

        .card {

            width: 100%;

            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);
        }

        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #4f46e5;

            margin-bottom: 30px;
        }

        .icon {

            width: 64px;

            height: 64px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #eef2ff;

            font-size: 30px;
        }

        h1 {

            text-align: center;

            color: #111827;

            margin-bottom: 15px;
        }

        p {

            color: #6b7280;

            line-height: 1.6;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #374151;
        }

        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 16px;

            margin-bottom: 20px;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .success {

            background: #ecfdf5;

            border: 1px solid #a7f3d0;

            color: #065f46;

            padding: 20px;

            border-radius: 10px;

            text-align: center;

            line-height: 1.6;
        }

        .error {

            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #991b1b;

            padding: 20px;

            border-radius: 10px;

            text-align: center;

            line-height: 1.6;
        }

        .login {

            text-align: center;

            margin-top: 25px;
        }

        .login a {

            color: #4f46e5;

            text-decoration: none;

            font-weight: 600;
        }

    </style>

</head>


<body>

<div class="card">

    <div class="logo">
        EmailFlow
    </div>


    {% if error %}

        <div class="icon">
            ⚠️
        </div>

        <h1>
            Reset Link Problem
        </h1>

        <div class="error">
            {{ error }}
        </div>


        <div class="login">

            <a href="{{ url_for('forgot_password') }}">
                Request a new reset link
            </a>

        </div>


    {% elif success %}

        <div class="icon">
            ✓
        </div>

        <h1>
            Password Updated
        </h1>

        <div class="success">

            Your password has been successfully
            changed.

        </div>


        <div class="login">

            <a href="{{ url_for('login') }}">
                Continue to Login
            </a>

        </div>


    {% else %}

        <h1>
            Create a new password
        </h1>

        <p>
            Enter your new password below.
        </p>


        <form method="POST">

            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >


            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                required
            >


            <button type="submit">
                Reset Password
            </button>

        </form>

    {% endif %}

</div>

</body>

</html>
