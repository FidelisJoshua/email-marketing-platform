{% extends "dashboard_base.html" %}

{% block title %}
Create Landing Page - EmailFlow
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <h1>
            Create Landing Page
        </h1>

        <p>
            Build a page that turns visitors into subscribers.
        </p>

    </div>

</div>


<div class="card">

    <form
        method="POST"
        action="{{ url_for('create_landing_page') }}"
    >

        <!-- =============================================
             PAGE NAME
        ============================================== -->

        <div class="form-group">

            <label for="name">
                Landing Page Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Example: Newsletter Signup"
                required
            >

            <small>
                This is an internal name for your landing page.
            </small>

        </div>


        <!-- =============================================
             HEADLINE
        ============================================== -->

        <div class="form-group">

            <label for="headline">
                Headline
            </label>

            <input
                type="text"
                id="headline"
                name="headline"
                placeholder="Grow your audience with EmailFlow"
                required
            >

        </div>


        <!-- =============================================
             SUBHEADLINE
        ============================================== -->

        <div class="form-group">

            <label for="subheadline">
                Subheadline
            </label>

            <input
                type="text"
                id="subheadline"
                name="subheadline"
                placeholder="Build your email list and grow your business."
            >

        </div>


        <!-- =============================================
             DESCRIPTION
        ============================================== -->

        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="6"
                placeholder="Tell visitors why they should subscribe..."
            ></textarea>

        </div>


        <!-- =============================================
             BUTTON TEXT
        ============================================== -->

        <div class="form-group">

            <label for="button_text">
                Button Text
            </label>

            <input
                type="text"
                id="button_text"
                name="button_text"
                value="Get Started"
            >

        </div>


        <!-- =============================================
             BUTTON URL
        ============================================== -->

        <div class="form-group">

            <label for="button_url">
                Button URL
            </label>

            <input
                type="url"
                id="button_url"
                name="button_url"
                placeholder="https://example.com"
            >

            <small>
                Optional. You can add this later.
            </small>

        </div>


        <!-- =============================================
             ACTIONS
        ============================================== -->

        <div class="form-actions">

            <a
                href="{{ url_for('landing_pages') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Landing Page
            </button>

        </div>

    </form>

</div>

{% endblock %}
